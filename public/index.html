<!DOCTYPE html>
<html>
<head>
    <title>Monitor</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Webapp">
    <link rel="apple-touch-icon" href="res/icon-192.png">

    <link rel="stylesheet" href="res/bootstrap/css/bootstrap.css">

    <link rel="stylesheet" href="res/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.min.css">
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
    <script type="importmap">
        {
          "imports": {
            "uplot": "https://cdn.jsdelivr.net/npm/uplot@1.6.24/dist/uPlot.esm.js"
          }
        }
    </script>
</head>
<body>

<div id="title">
    <h1 style="font-size: 1.5em;"><span id="server-name"></span> Monitor <span id="app-version">N/A</span></h1>
</div>


<div class="container">
    <div class="row">
        <h2>Sensors</h2>
        <div class="d-flex flex-wrap gap-2">
            <div class="dropdown" id="sensor-dropdown-1">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    None
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                </ul>
            </div>
            <div class="dropdown" id="sensor-dropdown-2">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    None
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                </ul>
            </div>
            <div class="dropdown" id="sensor-dropdown-3">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    None
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                </ul>
            </div>
            <div class="dropdown" id="sensor-dropdown-4">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    None
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                </ul>
            </div>
        </div>
    </div>
    <div class="row">
        <!-- Nav tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab1-tab" data-bs-toggle="tab" data-bs-target="#tab1" type="button"
                        role="tab">Live Data
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab2-tab" data-bs-toggle="tab" data-bs-target="#tab2" type="button"
                        role="tab">History
                </button>
            </li>
        </ul>

        <!-- Tab panes -->
        <div class="tab-content border border-top-0 p-3">
            <!-- Live Data Tab -->
            <div class="tab-pane fade show active" id="tab1" role="tabpanel">


                <div class="chart-grid">
                    <div id="sensorChart1"></div>
                    <div id="sensorChart2"></div>
                    <div id="sensorChart3"></div>
                    <div id="sensorChart4"></div>
                </div>
            </div>
            <!-- History Tab -->
            <div class="tab-pane fade" id="tab2" role="tabpanel">
                <div class="mb-3">
                    <label for="dateInput" class="form-label">Select Date</label>
                    <div class="input-group">
                        <input type="date" class="form-control" id="dateInput">
                        <button type="button" class="btn btn-primary" id="historyReloadButton">Load History</button>
                    </div>
                    <div id="historyProgress" class="mt-2" style="display: none; align-items: center;">
                        <div class="spinner-border spinner-border-sm text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <div class="ms-2" id="historyProgressText">Loading sensor data...</div>
                    </div>
                </div>
                <div class="chart-grid">
                    <div id="historyChart1"></div>
                    <div id="historyChart2"></div>
                    <div id="historyChart3"></div>
                    <div id="historyChart4"></div>
                </div>
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-12 col-md-6">
            <h2>CPU Info</h2>
            <div id="cpu-info"
                 style="
                 background-color: #eee;
                 padding: 10px;
                 margin: 10px 0 10px 0;">
            </div>
        </div>

        <div class="col-12 col-md-6">
            <h2>Metrics</h2>
            <div class="table-container">
                <table class="table">
                    <thead>
                    <tr>
                        <th><i class="bi bi-cpu icon"></i> Metric</th>
                        <th>Value</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-clock icon"></i> Load History</td>
                        <td id="cpu-temp-history" style="font-weight: bold;line-height: 1.5;"></td>
                    </tr>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-thermometer-half"></i> CPU Temperature (C)</td>
                        <td><span class="status-temp">N/A </span></td>
                    </tr>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-speedometer icon"></i> CPU Load</td>
                        <td><span class="status-load">N/A </span>%</td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-memory icon"></i> RAM Usage</td>
                        <td id="status-ram">N/A</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <br><br><br>
</div>
<script>
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;

    if (isStandalone) {
        document.documentElement.classList.add('standalone');
    }
    console.log("IS STANDALONE: " + isStandalone);
</script>
<script type="module" src="/res/js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
