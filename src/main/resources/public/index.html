<!DOCTYPE html>
<html>
<head>
    <title>PC Monitor</title>

    <link href="res/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="res/bootstrap-icons.min.css">
    <script src="res/jquery.min.js"></script>


<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"-->
<!--          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">-->
<!--    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">-->
<!--    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>-->


    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Webapp">
    <link rel="apple-touch-icon" href="icon-192.png">


    <!-- Chart.js -->
    <script src="res/canvas.js.min.js"></script>
    <!--  https://cdn.canvasjs.com/canvasjs.min.js -->


    <script src="chart.js"></script>
    <script>
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                          || window.navigator.standalone === true;

        if (isStandalone) {
          document.documentElement.classList.add('standalone');
        }
    </script>

    <style>

        .monitor-chart{
        width: 100%;
        height: 270px;
        }

        #title{
        background-color:#efefef;
        color:black;
        padding: 10px;
        text-align: center;
        margin: 0 0 10px 0;
        }
        #title h1{
        font-size:1.8em;
        margin:0px;
        }

        @media (max-width: 1200px) {
            html {
                font-size: 85%; /* Reduce or increase as needed */
            }
        }

          @media (max-width: 700px) {
            html {
                font-size: 85%; /* Reduce or increase as needed */
            }
             .monitor-chart{
            height: 200px;
            }
<!--            #title h1{-->
<!--        display:none;-->
<!--        }-->
        }

    .col-md-6{
    margin: 20px 0;
    }

      .col-md-12{
    margin: 20px 0;
    }

    h2{
    margin-bottom:20px;

    }

    button{
          margin: 5px 10px !important;
    }

    container button{
        margin: 5px 10px !important;
        display: inline-block;
    }
    input{
    min-width: 100px;
    }
    .cornerButton{
    position: absolute; top: -5px; right: 5px; font-size:1.2em;
    opacity:0.6;
    }
    </style>
</head>
<body>

<div id="title">
    <h1>PC Monitor</h1>
</div>

<div class="container">
    <button onclick="copyStatus()" style="background-color: #ddd; font-weight: bold; padding: 10px 20px;
            border-radius: 5px; font-size: 1.5em; margin: 0px 20px 20px 0px; display: inline-block;">

                <span style="color:darkred;">
                      <i class="bi bi-thermometer-half"></i>
                      <span class="status-temp">N/A</span>C
                </span>

        <span style="color:blue; margin-left: 20px;">
                    <i class="bi bi-speedometer icon"></i>
                    <span class="status-load">N/A</span>%
                </span>
    </button>


    <div class="row">
        <!-- Nav tabs -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab1-tab" data-bs-toggle="tab" data-bs-target="#tab1" type="button"
                        role="tab">Live Data
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab2-tab" data-bs-toggle="tab" data-bs-target="#tab2" type="button"
                        role="tab"
                        onclick="loadHistory('')">History
                </button>
            </li>
        </ul>

        <!-- Tab panes -->
        <div class="tab-content border border-top-0 p-3">
            <div class="tab-pane fade show active" id="tab1" role="tabpanel">
                <div id="tempChart" class="col-12 col-md-6 monitor-chart"></div>
                <div id="loadChart" class="col-12 col-md-6 monitor-chart"></div>
            </div>
            <div class="tab-pane fade" id="tab2" role="tabpanel">

                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        Select saved history file
                    </button>
                    <ul class="dropdown-menu" id="dropdown-menu" style="max-height: 300px; overflow-y: scroll;">
                        <!--                        <li><a class="dropdown-item" href="#">Option 1</a></li>-->
                        <!--                        <li><a class="dropdown-item" href="#">Option 2</a></li>-->
                        <!--                        <li><a class="dropdown-item" href="#">Option 3</a></li>-->
                    </ul>
                </div>

                <br>

                <!--                <label for="file">Downloading progress:</label>-->
                <!--                <progress id="file" value="32" max="100"> 32% </progress>-->

                <div id="tempChart_history" class="col-12 col-md-6 monitor-chart"></div>
                <div id="loadChart_history" class="col-12 col-md-6 monitor-chart"></div>
            </div>
        </div>

    </div>

    <div class="row">
        <div class="col-12 col-md-6">
            <h2>Control</h2>
            <button onclick="shutdown()" class="btn btn-primary">Shutdown</button>
            <button onclick="suspend()" class="btn btn-primary">Suspend</button>
            <span id="commands">
            </span>

            <div style="position: relative; background-color: #eee; padding: 10px; margin: 10px 0 10px 0;">
                <button onclick="$('#custom-command-output').html('')"
                        class="btn btn-sm btn-light cornerButton"
                        title="Refresh Frequency Policy">
                    <i class="bi bi-eraser"></i>
                </button>
                <div id="custom-command-scroll" style="overflow-y: auto; min-height: 50px; max-height: 250px;">
                    <code id="custom-command-output" style="margin: 0; white-space: pre-wrap;"></code>
                </div>
            </div>


            <h3>Frequency Policy</h3>

            <div>
                Set Max Frequency: <input type="number" class="max-software-frequency"
                                          name="quantity" min="1" max="100" step="1"
                                          onchange="setMaxFrequency(this.value);"> MHZ
            </div>

            <div style="position: relative; background-color: #eee; padding: 10px; margin: 10px 0 10px 0;">
                <button onclick="setMaxFrequency(-1)"
                        class="btn btn-sm btn-light cornerButton"
                        title="Refresh Frequency Policy">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <div style="overflow-y: auto; max-height: 90px;">
                    <p id="frequency-policy" style="margin: 0;"></p>
                </div>
            </div>

        </div>

        <div class="col-12 col-md-6">
            <div class="table-container">
                <table class="table">
                    <thead>
                    <tr>
                        <th><i class="bi bi-cpu icon"></i> Metric</th>
                        <th>Value</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-clock icon"></i> Load History</td>
                        <td id="cpu-temp-history" style="font-weight: bold;line-height: 1.5;"></td>
                    </tr>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-thermometer-half"></i> CPU Temperature (C)</td>
                        <td><span class="status-temp">N/A </span></td>
                    </tr>
                    <tr style="font-weight: bold;">
                        <td><i class="bi bi-speedometer icon"></i> CPU Load</td>
                        <td><span class="status-load">N/A </span>%</td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-memory icon"></i> RAM Usage</td>
                        <td id="status-ram">N/A</td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-info-circle icon"></i> App version</td>
                        <td><span class="app-version">N/A</span></td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-info-circle icon"></i> Running as admin</td>
                        <td><span id="is-admin">N/A</span></td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-info-circle icon"></i> Update interval</td>
                        <td><span id="app-interval">N/A</span></td>
                    </tr>
                    <tr>
                        <td><i class="bi bi-info-circle icon"></i> Connection</td>
                        <td><span id="conn-status"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <br><br><br>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
